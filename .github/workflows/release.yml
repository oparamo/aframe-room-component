name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: npm verifies this job's OIDC token against the package's configured
      # publisher, so there is no NPM_TOKEN to leak, and its absence below is deliberate.
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The demo loads /src/index.ts in development; the deployed copy swaps in the bundle that
      # was just published, which is a classic script rather than a module. It is served as .js
      # because Pages would send a .ts file with a video MIME type.
      - name: Prepare demo site
        if: steps.changesets.outputs.published == 'true'
        run: |
          cp -r example/ _site/
          install -D dist/aframe-room-component.min.js _site/src/index.js
          sed -i 's| type="module"||; s|/src/index.ts|/src/index.js|' _site/index.html

      - uses: actions/upload-pages-artifact@v5
        if: steps.changesets.outputs.published == 'true'
        with:
          path: _site/

  deploy-pages:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
