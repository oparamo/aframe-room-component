<!DOCTYPE html>
<html>

<head>
  <title>A-Frame Room Component: performance</title>

  <meta charset="utf-8">
  <meta name="description" content="A grid of rooms for measuring the frame cost of aframe-room-component.">

  <link type="image/png" sizes="96x96" rel="icon" href="https://img.icons8.com/doodle/96/null/home--v1.png">
  <link rel="stylesheet" href="perf.css">

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script type="module" src="/src/index.ts"></script>
</head>

<body>
  <a-scene stats background="color: #9bc">
    <a-light type="directional" intensity="0.9" position="-1 2 2"></a-light>
    <a-light type="ambient" intensity="0.5"></a-light>
    <a-plane rotation="-90 0 0" position="0 -0.01 0" width="400" height="400" color="#686"></a-plane>

    <a-entity id="player" camera="active: true" look-controls="reverseMouseDrag: true"
      wasd-controls="acceleration: 200"></a-entity>
  </a-scene>

  <div id="readout"></div>

  <script type="module" src="perf.js"></script>
</body>

</html>
