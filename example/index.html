<!DOCTYPE html>
<html>

<head>
  <title>A-Frame Room Component</title>

  <meta charset="utf-8">
  <meta name="description" content="An A-Frame component for quickly creating rooms connected by doors.">

  <link type="image/png" sizes="96x96" rel="icon" href="https://img.icons8.com/doodle/96/null/home--v1.png">

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script type="module" src="/src/index.ts"></script>
</head>

<body>
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .check">

    <a-assets>
      <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
      <img id="skyTexture" src="https://cdn.aframe.io/a-painter/images/sky.jpg" crossorigin="anonymous">
      <img id="testTex" src="test.png">

      <a-mixin id="floorMat" material="src:#testTex; repeat:0.5 0.5"></a-mixin>
    </a-assets>

    <a-sky height="2048" radius="30" src="#skyTexture" theta-length="90" width="2048" segments-height="5"
      segments-width="8"></a-sky>

    <a-plane src="#groundTexture" rotation="-90 0 0" position="0 -0.01 0" height="100" width="100"></a-plane>

    <a-light type="directional" intensity="0.9" position="-1 -2 2"></a-light>
    <a-light type="directional" intensity="1.0" position="2 1 -1"></a-light>
    <a-light type="ambient" intensity="0.4"></a-light>

    <a-entity id="player" camera="active: true" look-controls="reverseMouseDrag: true" wasd-controls room-collision
      position="0 1.6 14">
    </a-entity>

    <!-- Signpost by the path: what this is, how to use the page, and the checks that need the inspector. -->
    <a-entity id="signpost" position="-3 0 10" rotation="0 20 0">
      <a-cylinder position="-1 0.6 -0.05" radius="0.05" height="1.2" color="#5a3d22"></a-cylinder>
      <a-cylinder position="1 0.6 -0.05" radius="0.05" height="1.2" color="#5a3d22"></a-cylinder>
      <a-plane id="signAbout" position="-1 1.85 0" width="1.9" height="1.3" color="#222"></a-plane>
      <a-plane id="signHelp" position="1 1.85 0" width="1.9" height="1.3" color="#222"></a-plane>
      <a-plane position="-1 1.85 -0.01" rotation="0 180 0" width="1.9" height="1.3" color="#444"></a-plane>
      <a-plane position="1 1.85 -0.01" rotation="0 180 0" width="1.9" height="1.3" color="#444"></a-plane>
    </a-entity>

    <!-- Main building. Room A's corners are listed so each wall runs from its corner to the next. -->
    <a-room id="roomA" height="3" material="color:#F88">
      <a-wall id="a0" position="-6 0 -7"></a-wall>
      <a-wall id="a1" position="0 0 -7">
        <a-opening id="aRight"></a-opening>
      </a-wall>
      <a-wall id="a2" position="0 0 -2">
        <a-opening id="aFront"></a-opening>
      </a-wall>
      <a-wall id="a3" position="-6 0 -2"></a-wall>
      <a-floor id="floorA" mixin="floorMat"></a-floor>
      <a-ceiling material="color:#AAA"></a-ceiling>
    </a-room>

    <!-- Width/length room: walls are back, right, near, left. -->
    <a-room id="roomB" position="1 0 -7" width="4" length="5" height="3" material="color:#8AF">
      <a-wall>
        <a-opening id="bBack"></a-opening>
      </a-wall>
      <a-wall></a-wall>
      <a-wall>
        <a-opening id="bWindow"></a-opening>
      </a-wall>
      <a-wall>
        <a-opening id="bLeft"></a-opening>
      </a-wall>
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="color:#99A"></a-ceiling>
    </a-room>

    <!-- Room C's near wall lies in the same plane as room B's back wall. -->
    <a-room id="roomC" height="3" material="color:#C9A">
      <a-wall id="c0" position="1 0 -12">
        <a-box position="1 1.4 0" scale="0.5 0.5 0.2" color="#446"></a-box>
        <a-box position="2.5 1.7 0" scale="0.5 0.5 0.2" color="#446"></a-box>
        <a-box position="4 1.4 0" scale="0.5 0.5 0.2" color="#446"></a-box>
      </a-wall>
      <a-wall position="6 0 -12">
        <a-opening id="cRight"></a-opening>
      </a-wall>
      <a-wall position="6 0 -7">
        <a-opening id="cNear"></a-opening>
      </a-wall>
      <a-wall position="1 0 -7" material="src:#testTex; repeat:0.5 0.5"></a-wall>
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="color:#99A"></a-ceiling>
    </a-room>

    <!-- Outside rooms list their walls the other way round: left, back, right, front. -->
    <a-room id="shell" outside="true" height="4.4" material="color:#877">
      <a-wall position="-8 0 -14"></a-wall>
      <a-wall position="8 0 -14"></a-wall>
      <a-wall position="8 0 0">
        <a-opening id="shellRight"></a-opening>
      </a-wall>
      <a-wall position="-8 0 0">
        <a-opening id="shellFront"></a-opening>
        <a-opening id="shellWindow"></a-opening>
      </a-wall>
    </a-room>

    <a-portal from="#aFront" to="#shellFront" width="1.2" height="2.2" position="-3 0 -1">
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="color:#778"></a-ceiling>
      <a-sides material="color:#778"></a-sides>
    </a-portal>

    <a-portal from="#bWindow" to="#shellWindow" width="1.2" height="1" floor-height="0.9" position="3 0 -1">
      <a-floor></a-floor>
      <a-ceiling></a-ceiling>
      <a-sides></a-sides>
    </a-portal>

    <a-portal from="#cRight" to="#shellRight" width="1.2" height="2.2" position="7 0 -9.5">
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="color:#778"></a-ceiling>
      <a-sides material="color:#778"></a-sides>
    </a-portal>

    <!-- No surfaces: the rooms share a wall plane, so there is no gap to fill. -->
    <a-portal from="#bBack" to="#cNear" width="1.2" height="2.2" position="3 0 -7"></a-portal>

    <!-- Low outside room whose ceiling is a roof you look down on. -->
    <a-room id="planter" position="-7 0 4" width="3" length="2" height="0.6" outside="true"
      material="color:#6a4">
      <a-wall></a-wall>
      <a-wall></a-wall>
      <a-wall></a-wall>
      <a-wall></a-wall>
      <a-ceiling material="src:#testTex; repeat:0.5 0.5"></a-ceiling>
    </a-room>

    <!-- Width/length lobby inside a width/length shell, door on both near walls. -->
    <a-room id="lobbyShell" position="11 0 2" width="6" length="6" height="3.4" outside="true"
      material="color:#7a8">
      <a-wall></a-wall>
      <a-wall></a-wall>
      <a-wall></a-wall>
      <a-wall>
        <a-opening id="lobbyShellDoor"></a-opening>
      </a-wall>
    </a-room>

    <a-room id="lobby" position="12 0 3" width="4" length="4" height="2.8" material="color:#DDB">
      <a-wall></a-wall>
      <a-wall material="color:#BBD"></a-wall>
      <a-wall>
        <a-opening id="lobbyDoor"></a-opening>
      </a-wall>
      <a-wall material="color:#DBB"></a-wall>
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="color:#AAA"></a-ceiling>
    </a-room>

    <a-portal from="#lobbyDoor" to="#lobbyShellDoor" width="1.2" height="2.2" position="14 0 7.5">
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="color:#778"></a-ceiling>
      <a-sides material="color:#778"></a-sides>
    </a-portal>

    <!-- Rotated pavilion; its door portal is a child of the shell wall, so it moves with the rooms. -->
    <a-room id="pavilion" position="14 0 -8" rotation="0 -30 0" height="2.6" material="color:#EDB">
      <a-wall position="0 0 0"></a-wall>
      <a-wall position="3 0 0"></a-wall>
      <a-wall position="3 0 3">
        <a-opening id="pavilionDoor"></a-opening>
      </a-wall>
      <a-wall position="0 0 3"></a-wall>
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="color:#AAA"></a-ceiling>
    </a-room>

    <a-room id="pavilionShell" position="14 0 -8" rotation="0 -30 0" height="3" outside="true"
      material="color:#9a8">
      <a-wall position="-0.3 0 -0.3"></a-wall>
      <a-wall position="3.3 0 -0.3"></a-wall>
      <a-wall position="3.3 0 3.3"></a-wall>
      <a-wall position="-0.3 0 3.3">
        <a-opening id="pavilionShellDoor"></a-opening>
        <a-portal from="#pavilionDoor" to="#pavilionShellDoor" width="1.2" height="2.2" position="1.8 0 0">
          <a-floor mixin="floorMat"></a-floor>
          <a-ceiling material="color:#778"></a-ceiling>
          <a-sides material="color:#778"></a-sides>
        </a-portal>
      </a-wall>
    </a-room>

    <!-- U-shaped room inside a U-shaped shell; the notch opens toward the path as a courtyard. -->
    <a-room id="uRoom" height="2.8" material="color:#ACE">
      <a-wall position="-22 0 -12"></a-wall>
      <a-wall position="-14 0 -12"></a-wall>
      <a-wall position="-14 0 -4"></a-wall>
      <a-wall position="-16 0 -4"></a-wall>
      <a-wall position="-16 0 -8">
        <a-opening id="uDoor"></a-opening>
      </a-wall>
      <a-wall position="-20 0 -8"></a-wall>
      <a-wall position="-20 0 -4"></a-wall>
      <a-wall position="-22 0 -4"></a-wall>
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="color:#AAA"></a-ceiling>
    </a-room>

    <a-room id="uShell" outside="true" height="3.2" material="color:#987">
      <a-wall position="-23 0 -13"></a-wall>
      <a-wall position="-13 0 -13"></a-wall>
      <a-wall position="-13 0 -3"></a-wall>
      <a-wall position="-17 0 -3"></a-wall>
      <a-wall position="-17 0 -7"></a-wall>
      <a-wall position="-19 0 -7">
        <a-opening id="uShellDoor"></a-opening>
      </a-wall>
      <a-wall position="-19 0 -3"></a-wall>
      <a-wall position="-23 0 -3"></a-wall>
    </a-room>

    <a-portal from="#uDoor" to="#uShellDoor" width="1.2" height="2.2" position="-18 0 -7.5">
      <a-floor mixin="floorMat"></a-floor>
      <a-ceiling material="src:#testTex; repeat:0.5 0.5"></a-ceiling>
      <a-sides material="src:#testTex; repeat:0.5 0.5"></a-sides>
    </a-portal>

  </a-scene>

  <script src="demo.js"></script>

  <!-- GitHub Corner. -->
  <a href="https://github.com/oparamo/aframe-room-component" class="github-corner">
    <svg width="80" height="80" viewBox="0 0 250 250"
      style="fill:#222; color:#fff; position: absolute; top: 0; border: 0; right: 0;">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
      <path
        d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
        fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
      <path
        d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
        fill="currentColor" class="octo-body"></path>
    </svg>
  </a>
  <!-- End GitHub Corner. -->
</body>

</html>
