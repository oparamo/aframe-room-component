# aframe's three-bmfont-text comes from a git repository, which pnpm refuses in subdependencies.
# Only aframe's prebuilt bundle in dist/ is used here, and the bundle already contains it.
overrides:
  three-bmfont-text: "-"

# unrs-resolver (behind eslint-import-resolver-typescript) ships prebuilt binaries as optional
# dependencies; its install script is only a fallback for platforms without one.
allowBuilds:
  unrs-resolver: false
